<template id="what-is-micromodal"><span class="cat mono">Fabric</span><h2>What is micromodal?</h2><p>Modal is a regenerated cellulose fibre. It starts as wood pulp, most commonly from beech trees, which is processed and spun into a fibre that can be knitted or woven like any other yarn.</p>
<p>Micromodal is the same idea taken finer: each filament is thinner than standard modal. Finer fibres make a lighter, smoother fabric with a soft, almost silky hand and a fluid drape.</p>
<h3>Why it works next to skin</h3>
<ul><li><b>Softness.</b> Fine fibres give a smooth surface that sits close without scratching.</li>
<li><b>Moisture.</b> Like other cellulose fibres, modal absorbs moisture well, which helps fabric feel fresher through long, warm days.</li>
<li><b>Stretch, when blended.</b> On its own micromodal drapes; blended with a small amount of elastane it stretches and recovers, which is what activewear and base layers need.</li>
<li><b>Softness that lasts.</b> Modal fabrics are known for staying soft wash after wash when cared for properly.</li></ul>
<h3>Caring for it</h3>
<p>Follow the care label. In general, fine cellulose knits prefer a gentle wash, mild detergent, no bleach and air drying over high heat.</p>
<p class="src mono">Background: <a href="https://www.tencel.com/us/close-to-you-meet-the-tencel-modal-family" rel="noopener">TENCEL™ Modal family (Lenzing)</a></p></template><template id="move-with-you"><span class="cat mono">Fit</span><h2>Why your base layer should move with you</h2><p>The best base layer is the one you stop noticing. That comes down to a few simple things.</p>
<h3>Stretch and recovery</h3><p>Fabric should give when you squat, sprint or stride, then return to shape. A soft fibre blended with a little elastane does both.</p>
<h3>A leg that stays put</h3><p>Ride-up is mostly about cut and fit: a leg opening shaped to sit where it should, in the right size.</p>
<h3>A waistband you forget</h3><p>Look for a band that holds without digging in, and flat seams where fabric meets skin.</p>
<h3>Fabric that breathes</h3><p>Lightweight, moisture-absorbing fibres like micromodal help you stay comfortable when it gets warm.</p>
<h3>Get the size right</h3><p>Measure your waist and use the brand's own size chart. Every label cuts differently.</p></template><template id="story"><span class="cat mono">ThrustDay</span><h2>The story behind ThrustDay</h2><p>ThrustDay started with two friends in India who wanted to build an apparel label for people who keep moving: activewear for training and daily wear for everything after.</p>
<h3>Why the name</h3><p>Thrust is the force that moves you forward. That is the feeling we want every piece to give you when you put it on. It is why our only line is <b>Feel the push</b>.</p>
<h3>Why start with a trunk</h3><p>Everything starts with what you wear underneath. If the base layer holds you back, nothing on top fixes it. So Launch 001 is a micromodal trunk, and we are getting it right first.</p>
<h3>What comes next</h3><p>Tees, shorts and joggers are next in the line. Sign up on the shop page to hear first.</p></template><template id="care"><span class="cat mono">Fabric</span><h2>How to look after micromodal</h2><p>Micromodal is fine and soft, so a little care goes a long way. Always check the label first; these are general habits for fine cellulose knits.</p>
<ul><li>Wash with similar colours on a gentle cycle.</li><li>Use a mild detergent and skip bleach.</li><li>Do not wring; press water out gently.</li><li>Air dry where you can, out of harsh direct heat.</li><li>Turn garments inside out to protect the surface.</li></ul></template>
